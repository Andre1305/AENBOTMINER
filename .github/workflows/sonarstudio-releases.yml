name: Publish SonarStudio versions
on:
  push:
    branches: [main]
    paths:
      - 'sonarstudio-versions.json'
      - 'outputs/SonarStudio-*/**'
      - 'tools/**'
      - 'Instalar-SonarStudio.ps1'
      - 'sonarstudio-runtime.toml'
      - '.github/workflows/sonarstudio-releases.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Windows launchers
        shell: pwsh
        run: |
          $versions = Get-Content sonarstudio-versions.json -Raw | ConvertFrom-Json
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          foreach ($version in $versions.versions) {
            & $csc /nologo /target:winexe /reference:System.Windows.Forms.dll ("/out:"+(Join-Path $version.folder 'SonarStudio.exe')) (Join-Path $version.folder 'Launcher.cs')
            if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          }
      - name: Validate source and package exact sonar models
        run: python tools/build_releases.py
      - name: Test original NMEA pipeline
        run: |
          python -m pip install pytest
          python -m pytest tests -v
      - name: Publish prereleases and downloadable ZIPs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions = Get-Content sonarstudio-versions.json -Raw | ConvertFrom-Json
          foreach ($version in $versions.versions) {
            $tag = $version.tag
            $zip = "dist/SonarStudio-$($version.version)-windows.zip"
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease --title "SonarStudio $($version.version)" --notes "Versão experimental. Inclui código, launcher Windows, modelos específicos de sonar e instalador de dependências via Pixi. Não inclui ambiente Python nem gravações privadas. Veja README e docs/SONARSTUDIO.md. Validação local: Rec00001/Rec00002; candidatos IA exigem revisão."
            } else {
              Write-Output "Release existente preservada: $tag"
            }
            if ($LASTEXITCODE -ne 0) { throw "Release failed: $tag" }
          }
